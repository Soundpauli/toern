[platformio]
src_dir = .
default_envs = teensy41

[env:teensy41]
platform = platformio/teensy@6.0.0
board = teensy41
; Canonical build: 816 MHz + USB MIDI/Audio/Serial + smallest-code.
; Keep FLASHMEM on large UI handlers (checkMode/checkEncoders).
; Only Audio/filter_ladder.cpp uses -O2 to inline its 4x DSP kernel.
board_build.f_cpu = 816000000L
framework = arduino
extra_scripts =
  pre:scripts/platformio_patch_dependencies.py
  pre:scripts/platformio_audio_dsp.py

; Keep the existing Arduino multi-tab sketch layout while excluding the PCB,
; documentation, and host-side tools kept outside this firmware directory.
build_src_filter =
  -<*>
  +<*.ino>
  +<*.cpp>
  +<src/effect_treeverb.cpp>
  +<src/effect_delay_ext.cpp>
  +<src/toern_psram_mpu.cpp>
  +<src/play_sd_wav_preview.cpp>
  +<src/toern_launchpad.cpp>

build_flags =
  ; Restore long-cable timing synchronously after library Wire.begin() calls.
  -Wl,--wrap=_ZN7TwoWire5beginEv
  ; Reject early UI transfers until the codec has initialized primary Wire.
  -Wl,--wrap=_ZN7TwoWire15endTransmissionEh
  -Wl,--wrap=_ZN7TwoWire11requestFromEhhh
  ; USB MIDI + Audio + Serial: DIN/USB MIDI, host hears mix via USB sound card, Serial for SD tool.
  -D USB_MIDI_AUDIO_SERIAL
  ; USB-host Launchpad mixer (soldered Teensy host port). USBHost ITCM cost means
  ; MCP remote cannot fit at the same time — use teensy41-mcp for MCP without Launchpad.
  -D TOERN_LAUNCHPAD_HOST=1
  -D USBHOST_PRINT_DEBUG
  -D TOERN_REMOTE_CONTROL=0
  ; Canonical optimize: smallest-code for DTCM/ITCM headroom (not FASTER).
  -D TEENSY_OPT_SMALLEST_CODE
  ; Reverb: 0=light 4/2, 1=balanced 6/4, 2=full 8/4 (very little RAM1 headroom).
  ; Light while USB-host Launchpad is enabled — frees ~48KB RAM1 vs balanced.
  -D TOERN_TREEVERB_QUALITY=0

lib_ldf_mode = deep+
lib_deps =
  SPI
  Wire
  EEPROM
  SD
  SdFat
  LittleFS
  SerialFlash
  WS2812Serial
  fortyseveneffects/MIDI Library@5.0.2
  fastled/FastLED@3.9.10
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit seesaw Library@1.7.9
  ; Last revision before the incompatible multi-channel MIDI API change.
  https://github.com/newdigate/teensy-polyphony.git#548180ac82a3205a278949a15ec0f6758b29b06c
  https://github.com/newdigate/teensy-variable-playback.git#1.0.16
  natnqweb/Mapf@1.0.2
  https://github.com/Fattoresaimon/ArduinoDuPPaLib.git#v1.2.0
  https://github.com/AdrianFreed/FastTouch.git#7be8c307d290143bf1f4c3a5315bd8957220fe5e

monitor_speed = 115200
monitor_filters = time

; MCP remote without Launchpad USB-host (does not inherit Launchpad/MCP-off flags).
[env:teensy41-mcp]
extends = env:teensy41
build_flags =
  -Wl,--wrap=_ZN7TwoWire5beginEv
  -Wl,--wrap=_ZN7TwoWire15endTransmissionEh
  -Wl,--wrap=_ZN7TwoWire11requestFromEhhh
  -D USB_MIDI_AUDIO_SERIAL
  -D TOERN_LAUNCHPAD_HOST=0
  -D TOERN_REMOTE_CONTROL=1
  -D TEENSY_OPT_SMALLEST_CODE
  -D TOERN_TREEVERB_QUALITY=1

; Alias: same as default (Launchpad host, no MCP).
[env:teensy41-no-mcp]
extends = env:teensy41

; Same firmware with the grounded-button / NeoSlider external panel enabled.
[env:teensy41-modulr]
extends = env:teensy41
build_flags =
  ${env:teensy41.build_flags}
  -D TOERN_EXT_TOUCH=1
