<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TŒRN — Search handbook</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preload" href="fonts/bebas-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/jetbrains-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="handbook-fonts.css?v=20261011d" />
  <link rel="stylesheet" href="handbook.css?v=20261016s" />
</head>
<body class="hb-body hb-body--search" data-hb-section="start">
<a class="hb-skip" href="#hb-content">Skip to content</a>
<div class="hb-app">
  <button type="button" class="hb-nav-toggle" id="hb-nav-toggle" aria-expanded="false" aria-controls="hb-sidebar" aria-label="Open handbook menu"><span class="hb-nav-toggle__icon" aria-hidden="true"><span></span><span></span><span></span></span></button>
  <div class="hb-nav-backdrop" id="hb-nav-backdrop" aria-hidden="true"></div>
  <aside id="hb-sidebar" class="hb-sidebar" aria-label="Handbook chapters"></aside>
  <script src="handbook-layout.js?v=20261016s"></script>
  <script src="handbook-language.js?v=20261016w"></script>
  <script src="handbook-icons.js"></script>
  <script src="handbook-nav.js?v=20261016s"></script>

  <div class="hb-main">
    <div id="hb-content" class="hb-main__scroll" tabindex="-1">
      <div class="wrap">
        <section class="hb-ask" aria-labelledby="hb-ask-heading">
          <p class="hb-ask__eyebrow">Handbook</p>
          <h1 id="hb-ask-heading" class="hb-ask__title">Search</h1>
          <p class="hb-ask__lede">Find a chapter, menu, gesture, or term across the whole guide.</p>
          <form id="hb-ask-form" class="hb-ask__form" action="search.html" method="get" role="search">
            <label class="hb-vh" for="hb-ask-q">Search the handbook</label>
            <div class="hb-ask__composer">
              <textarea
                id="hb-ask-q"
                name="q"
                class="hb-ask__input"
                rows="2"
                placeholder="e.g. mute page, tap tempo, sample kit…"
                autocomplete="off"
                enterkeyhint="search"
              ></textarea>
              <div class="hb-ask__toolbar">
                <p class="hb-ask__hint">Enter to search · Shift+Enter for a new line</p>
                <button type="submit" class="hb-ask__submit">Search</button>
              </div>
            </div>
          </form>
        </section>

        <section class="hb-search-results-section" aria-live="polite">
          <div id="hb-search-results" class="hb-search-results"></div>
        </section>
      </div>
      <script src="handbook-search.js?v=20261016w" defer></script>
    </div>
  </div>
</div>
</body>
</html>
