[platformio]
default_envs = teensy41-ramtest

[env:teensy41-ramtest]
platform = platformio/teensy@6.0.0
board = teensy41
framework = arduino
; Match the instrument's operating CPU clock and core PSRAM initialization.
board_build.f_cpu = 816000000L
build_flags =
  -D USB_SERIAL
  -D TEENSY_OPT_SMALLEST_CODE
