[platformio]
src_dir = .

[env:teensy41]
platform = platformio/teensy@6.0.0
board = teensy41
framework = arduino
extra_scripts = pre:scripts/platformio_patch_dependencies.py

; Keep the existing Arduino multi-tab sketch layout while excluding the PCB,
; documentation, and host-side tools that also live below the repository root.
build_src_filter =
  -<*>
  +<*.ino>
  +<*.cpp>
  +<src/effect_freeverb_dmabuf.cpp>

build_flags =
  ; USB MIDI for normal use; Serial remains available for diagnostics.
  -D USB_MIDI_SERIAL
  -D TEENSY_OPT_FASTER

lib_ldf_mode = deep+
lib_deps =
  SPI
  Wire
  EEPROM
  SD
  SdFat
  LittleFS
  SerialFlash
  WS2812Serial
  fortyseveneffects/MIDI Library@5.0.2
  fastled/FastLED@3.9.10
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit seesaw Library@1.7.9
  ; Last revision before the incompatible multi-channel MIDI API change.
  https://github.com/newdigate/teensy-polyphony.git#548180ac82a3205a278949a15ec0f6758b29b06c
  https://github.com/newdigate/teensy-variable-playback.git#1.0.16
  natnqweb/Mapf@1.0.2
  https://github.com/Fattoresaimon/ArduinoDuPPaLib.git#v1.2.0
  https://github.com/AdrianFreed/FastTouch.git#7be8c307d290143bf1f4c3a5315bd8957220fe5e

monitor_speed = 115200
monitor_filters = time
